name: iac-apply

# Chained: runs when iac-plan completes successfully for a change from main.
# Promotion: apply-dev -> apply-test -> apply-prod. dev applies directly;
# test and prod are gated by their environments (= required reviewers =>
# manual approval). Only affected cloud/stage combos run.
on:
  workflow_run:
    workflows: ["iac-plan"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TOFU_VERSION: 1.10.1
  TG_VERSION: 0.82.3
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  load:
    # workflow_run.head_branch is always main here (iac-plan runs on the default
    # branch), so gate on the origin encoded in iac-plan's run-name instead.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.display_title, format('iac-plan [push main {0}] ', github.repository)) ||
        startsWith(github.event.workflow_run.display_title, format('iac-plan [workflow_dispatch main {0}] ', github.repository))))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      test: ${{ steps.l.outputs.test }}
      dev: ${{ steps.l.outputs.dev }}
      prod: ${{ steps.l.outputs.prod }}
      has_test: ${{ steps.l.outputs.has_test }}
      has_dev: ${{ steps.l.outputs.has_dev }}
      has_prod: ${{ steps.l.outputs.has_prod }}
    steps:
      - name: Resolve planned commit
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_TITLE: ${{ github.event.workflow_run.display_title }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="${PLAN_TITLE##* }"
          else
            SHA="$DISPATCH_SHA"
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid sha '$SHA'"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      # The title only carries a ref *name*; a tag called "main" would pass the gate.
      - name: Verify commit is on main
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
      - name: Download affected matrix (from iac-plan run)
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # download-artifact@v4 can flake with "Requires authentication" on
          # cross-run downloads; retry, then let the next step recompute on failure.
          for i in 1 2 3 4 5; do
            rm -rf _dl
            if gh run download "${{ github.event.workflow_run.id }}" -n affected -D _dl; then
              f="$(find _dl -name affected.json | head -1)"
              [ -n "$f" ] && cp "$f" affected.json && exit 0
            fi
            echo "download attempt $i failed; retrying in 5s"; sleep 5
          done
          echo "could not download the affected artifact; the next step will recompute"
      - id: l
        run: |
          if [ ! -f affected.json ]; then
            bash .github/scripts/affected.sh "" "" > affected.json
          fi
          TEST="$(jq -c '{include: [.include[] | select(.stage=="test")]}' affected.json)"
          DEV="$(jq -c '{include: [.include[] | select(.stage=="dev")]}' affected.json)"
          PROD="$(jq -c '{include: [.include[] | select(.stage=="prod")]}' affected.json)"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "prod=$PROD" >> "$GITHUB_OUTPUT"
          { [ "$(printf '%s' "$TEST" | jq '.include | length')" -gt 0 ] && echo "has_test=true" || echo "has_test=false"; } >> "$GITHUB_OUTPUT"
          { [ "$(printf '%s' "$DEV" | jq '.include | length')" -gt 0 ] && echo "has_dev=true" || echo "has_dev=false"; } >> "$GITHUB_OUTPUT"
          { [ "$(printf '%s' "$PROD" | jq '.include | length')" -gt 0 ] && echo "has_prod=true" || echo "has_prod=false"; } >> "$GITHUB_OUTPUT"

  apply-dev:
    needs: load
    if: needs.load.outputs.has_dev == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load.outputs.dev) }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUD: ${{ matrix.cloud }}
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.load.outputs.sha }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_command: --version
      - name: Apply dev (all stacks)
        run: make apply-all

  apply-test:
    needs: [load, apply-dev]
    if: >
      always() &&
      needs.load.outputs.has_test == 'true' &&
      (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load.outputs.test) }}
    runs-on: ubuntu-latest
    environment: test
    env:
      CLOUD: ${{ matrix.cloud }}
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.load.outputs.sha }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_command: --version
      - name: Apply test (all stacks)
        run: make apply-all

  apply-prod:
    needs: [load, apply-test]
    if: >
      always() &&
      needs.load.outputs.has_prod == 'true' &&
      (needs.apply-test.result == 'success' || needs.apply-test.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load.outputs.prod) }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      CLOUD: ${{ matrix.cloud }}
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.load.outputs.sha }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_command: --version
      - name: Apply prod (all stacks)
        run: make apply-all
