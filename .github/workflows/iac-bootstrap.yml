name: iac-bootstrap

# Manual only. Creates the state backend (resource group + storage account + container)
# for a cloud/stage. Run ONCE per stage: the bootstrap uses a local backend, so its
# state is not persisted across runs — re-running after the resources exist will fail.
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider
        type: choice
        options: [azure]
        default: azure
      stage:
        description: Stage
        type: choice
        options: [dev,test]

permissions:
  contents: read

env:
  TOFU_VERSION: 1.10.1
  TG_VERSION: 0.82.3
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      CLOUD: ${{ inputs.cloud }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_command: --version
      - name: Bootstrap state backend
        run: make bootstrap
